name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linter-and-unit:
    name: Linter and Unit test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}

      - name: Install Deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: Linter test
        run: pnpm run lint
